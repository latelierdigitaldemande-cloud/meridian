<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meridian — générateur de sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;
    --ink:#161616;
    --muted:#7a7a80;
    --card:#ffffff;
    --card-border:#e6e4e0;
    --input-bg:#f2f1ee;
    --accent:#3b82f6;
    --accent-2:#60a5fa;
    --danger:#dc2626;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.4;
    overscroll-behavior:none;
  }

  /* ---- étape 1 : accueil, verrouillée sur la hauteur d'écran, pas de scroll ---- */
  #step1{
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    overflow:hidden;
  }
  .step{display:none;}
  .step.active{display:flex;flex-direction:column;}

  nav{width:100%;max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-mark{
    width:34px;height:34px;border-radius:10px;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 60%, #1d4ed8 100%);
    box-shadow:0 0 18px rgba(59,130,246,0.55);
  }
  .wordmark{font-weight:800;font-size:1.15rem;letter-spacing:-0.01em;}

  .content-block{width:100%;max-width:480px;margin:auto auto;}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .hero-title{
    font-weight:800;
    font-size:clamp(1.9rem,8vw,2.6rem);
    line-height:1.08;
    letter-spacing:-0.02em;
    margin:0 0 10px;
  }
  .hero-sub{color:var(--muted);font-size:0.95rem;max-width:34ch;margin:0 auto 36px;}

  .promptCard{
    flex-shrink:0;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:12px 14px 14px;
    box-shadow:0 16px 40px rgba(0,0,0,0.08);
  }
  .promptCard textarea{
    width:100%;border:none;background:transparent;resize:none;
    font-family:inherit;font-size:1rem;color:var(--ink);
    height:52px;outline:none;padding:6px 6px 2px;
  }
  .promptCard textarea::placeholder{color:#6b6b72;}

  .promptRow{display:flex;align-items:center;gap:8px;}
  .sectorPillWrap{position:relative;flex:1;min-width:0;}
  select.sectorPill{
    width:100%;appearance:none;-webkit-appearance:none;
    background:var(--input-bg);color:var(--ink);border:1px solid var(--card-border);
    border-radius:999px;padding:10px 30px 10px 16px;font-family:inherit;font-size:0.85rem;
    cursor:pointer;outline:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sectorPillWrap::after{
    content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-55%);
    color:var(--muted);pointer-events:none;font-size:0.9rem;
  }

  button.submit-circle{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#0a0a0b;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;
    transition:filter .15s;
  }
  button.submit-circle:hover{filter:brightness(1.1);}
  button.submit-circle:disabled{background:#3a3a3f;color:#7a7a80;cursor:wait;filter:none;}

  .error{color:var(--danger);font-family:var(--mono);font-size:0.75rem;margin-top:10px;white-space:pre-wrap;text-align:center;flex-shrink:0;}
  .status{
    margin-top:10px;font-family:var(--mono);font-size:0.75rem;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;
  }
  .dot{width:6px;height:6px;background:var(--accent-2);border-radius:50%;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  /* ---- étape 2 : résultat ---- */
  #step2{max-width:1100px;margin:0 auto;padding:24px 20px 60px;min-height:100vh;}
  .result-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{
    background:transparent;border:1px solid var(--card-border);color:var(--ink);
    padding:8px 16px;font-family:var(--mono);font-size:0.82rem;cursor:pointer;border-radius:8px;
  }
  .tab.active{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#0a0a0b;border-color:transparent;}

  button.ghost{
    background:transparent;border:1px solid var(--card-border);color:var(--ink);
    padding:10px 18px;font-family:inherit;font-size:0.88rem;cursor:pointer;border-radius:10px;
  }
  button.ghost:hover{border-color:var(--accent);}

  .preview-frame-wrap{width:100%;display:flex;justify-content:center;}
  iframe{width:390px;max-width:100%;height:74vh;border:1px solid var(--card-border);border-radius:12px;background:#fff;}
  #codeView{
    width:100%;height:70vh;margin:0;padding:16px;border:1px solid var(--card-border);border-radius:12px;
    background:var(--input-bg);color:var(--ink);overflow:auto;font-family:var(--mono);font-size:0.8rem;
    white-space:pre-wrap;word-break:break-word;
  }
</style>
</head>
<body>

<section class="step active" id="step1">
  <nav>
    <div class="brand">
      <div class="logo-mark"></div>
      <span class="wordmark">Meridian</span>
    </div>
  </nav>

  <div class="content-block">
  <div class="hero">
    <h1 class="hero-title">Un site de luxe,<br>généré par l'IA.</h1>
    <p class="hero-sub">Décris ta marque et son secteur, obtiens une page complète en quelques instants.</p>
  </div>

  <div class="promptCard">
    <textarea id="brandName" placeholder="Nom de la marque, ex : REBOURT"></textarea>
    <div class="promptRow">
      <div class="sectorPillWrap">
        <select class="sectorPill" id="sectorSelect">
          <option value="" disabled selected>Secteur d'activité</option>
        </select>
      </div>
      <button class="submit-circle" id="btnGenerate" aria-label="Générer">↑</button>
    </div>
  </div>
  <div class="error" id="err1"></div>
  <div class="status" id="status" style="display:none;">
    <div class="dot"></div>
    <span id="statusText">Réflexion en cours…</span>
  </div>
  </div>
</section>

<section class="step" id="step2">
  <div class="error" id="err2"></div>
  <div class="result-bar">
    <button class="ghost" id="btnRestart">← Nouveau brief</button>
    <div class="actions">
      <button class="ghost" id="btnCopy">Copier le code</button>
      <button class="ghost" id="btnDownload">Télécharger le .html</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabPreview">Aperçu</button>
    <button class="tab" id="tabCode">Code</button>
  </div>
  <div class="preview-frame-wrap" id="frameWrap">
    <iframe id="resultFrame"></iframe>
  </div>
  <pre id="codeView" style="display:none;"></pre>
</section>

<script>
const SECTORS = [
  "Horlogerie",
  "Architecture",
  "Centre équestre",
  "Hôtellerie & spa",
  "Immobilier de prestige",
  "Yachting & nautisme"
];

const state = { sector: null, brandName: "", generatedHTML: "" };

function showStep(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
}
function setStatus(on, text){
  const el = document.getElementById('status');
  el.style.display = on ? 'flex' : 'none';
  if(text) document.getElementById('statusText').textContent = text;
}
function showError(msg){
  document.getElementById('err1').textContent = msg || "";
}

const sectorSelect = document.getElementById('sectorSelect');
SECTORS.forEach(sector=>{
  const opt = document.createElement('option');
  opt.value = sector;
  opt.textContent = sector;
  sectorSelect.appendChild(opt);
});
sectorSelect.addEventListener('change', ()=>{
  state.sector = sectorSelect.value;
});

document.getElementById('btnGenerate').addEventListener('click', async ()=>{
  showError('');
  state.brandName = document.getElementById('brandName').value.trim();

  if(!state.brandName){ showError("Indique le nom de la marque."); return; }
  if(!state.sector){ showError("Choisis un secteur avant de continuer."); return; }

  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  setStatus(true, "Direction artistique, développement, relecture… (peut prendre 30-60s)");

  try{
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ sector: state.sector, brandName: state.brandName })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || "Erreur serveur"); }

    state.generatedHTML = data.code;
    document.getElementById('resultFrame').srcdoc = data.code;
    document.getElementById('codeView').textContent = data.code;
    document.getElementById('tabPreview').click();
    showStep(2);
  }catch(e){
    showError("Ça n'a pas marché : " + e.message);
  }finally{
    btn.disabled = false;
    setStatus(false);
  }
});

document.getElementById('tabPreview').addEventListener('click', ()=>{
  document.getElementById('tabPreview').classList.add('active');
  document.getElementById('tabCode').classList.remove('active');
  document.getElementById('frameWrap').style.display = 'flex';
  document.getElementById('codeView').style.display = 'none';
});
document.getElementById('tabCode').addEventListener('click', ()=>{
  document.getElementById('tabCode').classList.add('active');
  document.getElementById('tabPreview').classList.remove('active');
  document.getElementById('frameWrap').style.display = 'none';
  document.getElementById('codeView').style.display = 'block';
});

document.getElementById('btnCopy').addEventListener('click', ()=>{
  navigator.clipboard.writeText(state.generatedHTML);
  const btn = document.getElementById('btnCopy');
  const old = btn.textContent;
  btn.textContent = "Copié !";
  setTimeout(()=> btn.textContent = old, 1500);
});

document.getElementById('btnDownload').addEventListener('click', ()=>{
  const blob = new Blob([state.generatedHTML], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "site-genere.html";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btnRestart').addEventListener('click', ()=>{
  state.sector = null;
  sectorSelect.selectedIndex = 0;
  document.getElementById('brandName').value = "";
  showError('');
  showStep(1);
});
</script>
</body>
</html>
