<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — générateur de sites</title>
<style>
  :root{
    --bg-deep:#f8f6fc;
    --ink:#1c1730;
    --muted:#786f96;
    --card:#ffffff;
    --card-border:#e6e1f2;
    --accent-a:#8b5cf6;
    --accent-b:#c084fc;
    --danger:#dc2626;
    --input-bg:#faf9fd;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background-color:var(--bg-deep);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(139,92,246,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 15%, rgba(192,132,252,0.10), transparent 60%);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:56px 24px 120px;}

  nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:100px;}
  .wordmark{font-weight:700;font-size:1.05rem;letter-spacing:-0.01em;}

  .step{display:none;}
  .step.active{display:block;}

  .hero-title{
    text-align:center;
    font-size:clamp(2.2rem,5.5vw,3.6rem);
    line-height:1.12;
    letter-spacing:-0.02em;
    margin:0 0 20px;
  }
  .hero-title .light{font-weight:400;color:var(--muted);}
  .hero-title .bold{font-weight:800;color:var(--ink);}

  .hero-sub{
    text-align:center;color:var(--muted);font-size:1.02rem;
    max-width:52ch;margin:0 auto 48px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:28px;
    box-shadow:0 20px 60px rgba(124,58,237,0.08);
  }

  .field{margin-bottom:22px;}
  .field label{display:block;font-size:0.85rem;margin-bottom:10px;color:var(--muted);}

  input[type=text]{
    width:100%;border:1px solid var(--card-border);background:var(--input-bg);
    padding:14px 16px;font-family:inherit;font-size:0.98rem;color:var(--ink);border-radius:12px;
  }
  input[type=text]::placeholder{color:#b0a8c4;}
  input[type=text]:focus{outline:none;border-color:var(--accent-a);}

  .sectors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sector-card{
    border:1px solid var(--card-border);border-radius:12px;padding:14px 10px;text-align:center;
    cursor:pointer;transition:background .15s,border-color .15s;font-size:0.85rem;color:var(--ink);
    background:var(--input-bg);
  }
  .sector-card:hover{border-color:var(--accent-a);}
  .sector-card.selected{
    background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    border-color:transparent;color:#0a0812;font-weight:600;
  }
  @media(max-width:560px){.sectors{grid-template-columns:repeat(2,1fr);}}

  button.primary{
    width:100%;
    background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    color:#0a0812;border:none;padding:16px 28px;font-weight:700;
    font-family:inherit;font-size:1rem;cursor:pointer;border-radius:12px;
    transition:filter .15s;
  }
  button.primary:hover{filter:brightness(1.1);}
  button.primary:disabled{background:#e6e1f2;color:#a79dbf;cursor:wait;filter:none;}

  button.ghost{
    background:transparent;border:1px solid var(--card-border);color:var(--ink);
    padding:10px 18px;font-family:inherit;font-size:0.88rem;cursor:pointer;border-radius:10px;
  }
  button.ghost:hover{border-color:var(--accent-a);}

  .status{
    margin-top:18px;font-family:var(--mono);font-size:0.82rem;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .dot{width:7px;height:7px;background:var(--accent-b);border-radius:50%;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  .error{color:var(--danger);font-family:var(--mono);font-size:0.82rem;margin-top:16px;white-space:pre-wrap;text-align:center;}

  .result-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{
    background:transparent;border:1px solid var(--card-border);color:var(--ink);
    padding:8px 16px;font-family:var(--mono);font-size:0.82rem;cursor:pointer;border-radius:8px;
  }
  .tab.active{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#0a0812;border-color:transparent;}

  iframe{width:100%;height:70vh;border:1px solid var(--card-border);border-radius:12px;background:#fff;}
  #codeView{
    width:100%;height:70vh;margin:0;padding:16px;border:1px solid var(--card-border);border-radius:12px;
    background:var(--input-bg);color:#2a2340;overflow:auto;font-family:var(--mono);font-size:0.8rem;
    white-space:pre-wrap;word-break:break-word;
  }
  #step2{max-width:1100px;margin:0 auto;}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="wordmark">Meridian</span>
  </nav>

  <section class="step active" id="step1">
    <h1 class="hero-title"><span class="bold">Un site de marque de luxe,</span><br><span class="light">pensé par trois agents IA.</span></h1>
    <p class="hero-sub">Direction artistique, développement et relecture s'enchaînent pour livrer une page complète en style Luxe tech.</p>

    <div class="card">
      <div class="field">
        <label>Secteur d'activité</label>
        <div class="sectors" id="sectorGrid"></div>
      </div>
      <div class="field">
        <label for="brandName">Nom de la marque</label>
        <input type="text" id="brandName" placeholder="Ex : REBOURT">
      </div>
      <button class="primary" id="btnGenerate">✦ Générer le site</button>
      <div class="error" id="err1"></div>
      <div class="status" id="status" style="display:none;">
        <div class="dot"></div>
        <span id="statusText">Réflexion en cours…</span>
      </div>
    </div>
  </section>

  <section class="step" id="step2">
    <div class="error" id="err2"></div>
    <div class="result-bar">
      <button class="ghost" id="btnRestart">← Nouveau brief</button>
      <div class="actions">
        <button class="ghost" id="btnCopy">Copier le code</button>
        <button class="ghost" id="btnDownload">Télécharger le .html</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabPreview">Aperçu</button>
      <button class="tab" id="tabCode">Code</button>
    </div>
    <iframe id="resultFrame"></iframe>
    <pre id="codeView" style="display:none;"></pre>
  </section>
</div>

<script>
const SECTORS = [
  "Horlogerie",
  "Architecture",
  "Centre équestre",
  "Hôtellerie & spa",
  "Immobilier de prestige",
  "Yachting & nautisme"
];

const state = { sector: null, brandName: "", generatedHTML: "" };

function showStep(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
}
function setStatus(on, text){
  const el = document.getElementById('status');
  el.style.display = on ? 'flex' : 'none';
  if(text) document.getElementById('statusText').textContent = text;
}
function showError(msg){
  document.getElementById('err1').textContent = msg || "";
}

const sectorGrid = document.getElementById('sectorGrid');
SECTORS.forEach(sector=>{
  const card = document.createElement('div');
  card.className = "sector-card";
  card.textContent = sector;
  card.addEventListener('click', ()=>{
    document.querySelectorAll('.sector-card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    state.sector = sector;
  });
  sectorGrid.appendChild(card);
});

document.getElementById('btnGenerate').addEventListener('click', async ()=>{
  showError('');
  state.brandName = document.getElementById('brandName').value.trim();

  if(!state.sector){ showError("Choisis un secteur avant de continuer."); return; }
  if(!state.brandName){ showError("Indique le nom de la marque."); return; }

  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  setStatus(true, "Direction artistique, développement, relecture… (peut prendre 30-60s)");

  try{
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ sector: state.sector, brandName: state.brandName })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || "Erreur serveur"); }

    state.generatedHTML = data.code;
    document.getElementById('resultFrame').srcdoc = data.code;
    document.getElementById('codeView').textContent = data.code;
    document.getElementById('tabPreview').click();
    showStep(2);
  }catch(e){
    showError("Ça n'a pas marché : " + e.message);
  }finally{
    btn.disabled = false;
    setStatus(false);
  }
});

document.getElementById('tabPreview').addEventListener('click', ()=>{
  document.getElementById('tabPreview').classList.add('active');
  document.getElementById('tabCode').classList.remove('active');
  document.getElementById('resultFrame').style.display = 'block';
  document.getElementById('codeView').style.display = 'none';
});
document.getElementById('tabCode').addEventListener('click', ()=>{
  document.getElementById('tabCode').classList.add('active');
  document.getElementById('tabPreview').classList.remove('active');
  document.getElementById('resultFrame').style.display = 'none';
  document.getElementById('codeView').style.display = 'block';
});

document.getElementById('btnCopy').addEventListener('click', ()=>{
  navigator.clipboard.writeText(state.generatedHTML);
  const btn = document.getElementById('btnCopy');
  const old = btn.textContent;
  btn.textContent = "Copié !";
  setTimeout(()=> btn.textContent = old, 1500);
});

document.getElementById('btnDownload').addEventListener('click', ()=>{
  const blob = new Blob([state.generatedHTML], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "site-genere.html";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btnRestart').addEventListener('click', ()=>{
  state.sector = null;
  document.querySelectorAll('.sector-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('brandName').value = "";
  showError('');
  showStep(1);
});
</script>
</body>
</html>
